[General]
__userfile__=true

[panel1]
alignment=-1
animation-duration=0
desktop=0
hidable=false
iconSize=22
lineCount=1
panelSize=36
position=Bottom
plugins=fancymenu, quicklaunch, taskbar, statusnotifier, volume, worldclock

[fancymenu]
type=fancymenu

[quicklaunch]
type=quicklaunch
apps\1\desktop=/usr/share/applications/firefox-esr.desktop
apps\2\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\3\desktop=/usr/share/applications/qterminal.desktop
apps\size=3

[taskbar]
type=taskbar

[statusnotifier]
type=statusnotifier

[volume]
type=volume
audioEngine=PulseAudio

[worldclock]
type=worldclock
