# Sigma OS - gilt fuer das installierte System (nach Aenderung: update-grub).
# Das Menue bleibt versteckt; beim Start Shift (BIOS) bzw. Esc (UEFI) halten, um es zu zeigen.
GRUB_DISTRIBUTOR="Sigma OS"
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
# preempt=full : geringere UI-Latenz unter Last (ca. 1-3 % weniger Durchsatz)
# nowatchdog   : spart Timer-Interrupts
# Sicherheits-Mitigations bleiben bewusst AN (kein mitigations=off).
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3 preempt=full nowatchdog"
