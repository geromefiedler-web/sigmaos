# Sigma OS - Kernel-Tuning. Rueckgaengig: Datei loeschen, dann "sysctl --system".

# --- Speicher (abgestimmt auf zram als einzigen Swap) ---
# zram ist viel schneller als Platten-Swap, daher frueh und seitenweise auslagern.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Verzeichnis-/Inode-Cache laenger halten -> schnellere Programmstarts.
vm.vfs_cache_pressure = 50
# Feste Grenzen statt Prozent: verhindert lange Haenger beim Schreiben auf langsame USB-Sticks.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# --- Netzwerk ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0

# --- Sonstiges ---
kernel.nmi_watchdog = 0
fs.inotify.max_user_watches = 524288
